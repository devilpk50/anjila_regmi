<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CC" />
      <stop offset="30%" stop-color="#F5E6BE" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7822" />
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Musical Sparkle Accent -->
  <path d="M 47 13 Q 48 18 53 19 Q 48 20 47 25 Q 46 20 41 19 Q 46 18 47 13 Z" fill="url(#goldGrad)" />
  <circle cx="17" cy="18" r="1.5" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Monogram A and R Intertwined -->
  <g filter="url(#goldGlow)">
    <!-- Letter A -->
    <path d="M 23 46 L 30.5 22 L 34.5 22 L 42 46 L 37.2 46 L 35.4 39.5 L 27.2 39.5 L 25.5 46 Z M 28.5 35.5 L 34.2 35.5 L 31.4 25.5 Z" fill="url(#goldGrad)" />
    
    <!-- Letter R overlay styled -->
    <path d="M 33 22 L 41.5 22 Q 46.5 22 46.5 28 Q 46.5 32.5 42.5 34 L 47 46 L 42 46 L 38 35.2 L 33 35.2 L 33 31.2 L 40.5 31.2 Q 42.8 31.2 42.8 28 Q 42.8 25.5 40.5 25.5 L 33 25.5 Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Treble Clef Accent Dot -->
    <circle cx="32" cy="49" r="1.8" fill="url(#goldGrad)" />
  </g>
</svg>